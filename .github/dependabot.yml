---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "⬆️"
    groups:
      github-actions:
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    labels:
      - dependencies
    commit-message:
      prefix: "⬆️"
    groups:
      python:
        update-types:
          - minor
          - patch
