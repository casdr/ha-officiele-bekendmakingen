[project]
name = "ha-officiele-bekendmakingen"
version = "0.0.0"
description = "Dutch official government notices (permits, traffic decrees, plans) near a location in Home Assistant."
authors = [{ name = "Cas de Reuver" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14.2,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "codespell==2.4.3",
  "mypy==2.4.1",
  "prek==0.5.11",
  "pylint==4.1.4",
  "pytest-cov==7.1.0",
  "pytest-homeassistant-custom-component==0.13.375",
  "ruff==0.17.5",
  "yamllint==1.38.0",
]

[tool.uv]
# This repository is a Home Assistant integration, not a Python package.
package = false

[tool.mypy]
platform = "linux"
python_version = "3.14"
show_column_numbers = true
follow_imports = "normal"
ignore_missing_imports = true
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true
strict_optional = true
warn_incomplete_stub = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_unreachable = true
explicit_package_bases = true

[[tool.mypy.overrides]]
# Home Assistant re-exports names, e.g. recorder.get_instance, without __all__.
module = "homeassistant.*"
implicit_reexport = true

[tool.pylint.BASIC]
good-names = ["_", "ex", "fp", "i", "id", "j", "k", "on", "Run", "T"]

[tool.pylint."MESSAGES CONTROL"]
disable = [
  # Home Assistant entities implement the async variants of these methods.
  "abstract-method",
  "too-few-public-methods",
  "too-many-positional-arguments",
  "duplicate-code",
  "format",
  "unsubscriptable-object",
]

[tool.pylint.SIMILARITIES]
ignore-imports = true

[tool.pylint.FORMAT]
max-line-length = 88

[tool.pylint.DESIGN]
max-attributes = 20

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
lint.select = ["ALL"]
lint.ignore = [
  "ANN401",  # Opinionated warning on disallowing dynamically typed expressions
  "CPY001",  # No copyright headers, the LICENSE file covers the project
  "D203",    # Conflicts with other rules
  "D213",    # Conflicts with other rules
  "D417",    # False positives in some occasions
  "PLR2004", # Just annoying, not really useful
  "SLOT000", # Has a bug with enums: https://github.com/astral-sh/ruff/issues/5748

  # Conflicts with the Ruff formatter
  "COM812",
  "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "S105", "S106", "S107", "SLF001"]

[tool.ruff.lint.flake8-pytest-style]
mark-parentheses = false
fixture-parentheses = false

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.ruff.lint.mccabe]
max-complexity = 25
